<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungca–David Family Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF3F0;--surface:#fff;--ink:#14302A;--mute:#5E7069;--line:#D5E0DA;--b:#B07A00;--a:#B03A66;--d:#566A7A;--acc:#0F5E4D;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--surface:#15251F;--ink:#E6F0EB;--mute:#93A8A0;--line:#27403A;--b:#E8B230;--a:#E27AA0;--d:#8FA5B6;--acc:#4FC3A1;--on:#06231B}}
:root[data-theme="dark"]{--bg:#0E1A17;--surface:#15251F;--ink:#E6F0EB;--mute:#93A8A0;--line:#27403A;--b:#E8B230;--a:#E27AA0;--d:#8FA5B6;--acc:#4FC3A1;--on:#06231B}
html{scroll-padding-top:150px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Hanken Grotesk',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 clamp(28px,5vw,44px)/1.05 Fraunces,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 20px;color:var(--mute)}
.stats b{color:var(--ink);font:700 22px Fraunces,Georgia,serif;margin-right:5px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row1,.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:inherit}
input[type=search],select,.f input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
input[type=search]{flex:1 1 200px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.add{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600;padding:8px 16px}
.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.soonbox{margin:18px 0 6px}
.soonbox h2{font:600 18px Fraunces,Georgia,serif;margin:0 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 12px;font-size:14px}
.chip b{display:block}
.chip span{color:var(--mute)}
.q{margin-top:30px}
.q>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:8px}
.q h2{font:700 34px Fraunces,Georgia,serif;margin:0}
.q header p{margin:0;color:var(--mute)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
summary b{background:var(--bg);border-radius:20px;padding:0 9px;font-size:13px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.b{--c:var(--b)}.a{--c:var(--a)}.d{--c:var(--d)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.dt{flex:0 0 46px;text-align:center;border-left:3px solid var(--c);line-height:1}
.dt span{font-size:12px;color:var(--mute)}
.dt b{display:block;font:700 22px Fraunces,Georgia,serif;margin-top:2px}
.who{flex:1;min-width:0}
.who em{color:var(--mute);font-style:normal}
.who small{display:block;color:var(--mute);font-size:13px}
.soon{background:var(--c);color:var(--on);border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.b .soon,.chip.b{--on:#fff}
.rm{padding:2px 8px;color:var(--mute)}
.none{margin:0;padding:12px 14px;color:var(--mute);border-top:1px solid var(--line)}
li.flash{animation:fl 2.4s ease-out}
@keyframes fl{from{background:color-mix(in srgb,var(--acc) 30%,transparent)}to{background:transparent}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:700 24px Fraunces,Georgia,serif;margin:0 0 12px}
.f{display:block;margin-bottom:10px;font-size:14px;color:var(--mute)}
.f input{display:block;width:100%;margin-top:3px;font-size:16px;color:var(--ink)}
.f small{display:block;min-height:16px;color:var(--acc)}
.err{color:#C0392B;min-height:20px;margin:0 0 6px;font-size:14px}
.acts{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
a.nm{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
a.nm:hover{color:var(--acc);border-bottom-color:var(--acc)}
.back{display:inline-block;margin:0 0 14px;color:var(--acc);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.crumbs{color:var(--mute);font-size:14px;margin:0 0 14px}
.crumbs a{color:var(--acc);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.tree{margin-top:20px;overflow-x:auto;padding-bottom:10px}
.un{position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin:0 0 8px;display:inline-block;min-width:min(100%,260px);max-width:100%}
.card.me{box-shadow:0 0 0 2px var(--acc)}
.pc+.pc{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pc a{font-weight:600;color:var(--ink);text-decoration:none}
.pc a:hover{color:var(--acc);text-decoration:underline}
.pc.me a{color:var(--acc)}
.pc em{color:var(--mute);font-style:normal}
.pc small{display:block;color:var(--mute);font-size:13px}
.gen{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.card.sib{min-width:0;padding:6px 12px;border-left-color:var(--line)}
.card.sib a{color:var(--ink);text-decoration:none;font-weight:600}
.card.sib a:hover{color:var(--acc);text-decoration:underline}
.card.sib small{display:block;color:var(--mute);font-size:13px}
.mar{margin-top:8px;font-size:13px;color:var(--a)}
.kids{margin:0 0 6px 16px;padding-left:18px;border-left:2px solid var(--line)}
.kids>.un::before{content:"";position:absolute;left:-18px;top:22px;width:18px;border-top:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="calView">
<h1>Dungca–David Family Calendar</h1>
<p class="sub">Birthdays, wedding anniversaries and death anniversaries, grouped by quarter. Add a new family member and they’re sorted in automatically.</p>
<div class="stats" id="stats"></div>
<div class="bar">
<div class="row1">
<input type="search" id="q" placeholder="Search name, nickname or family line" aria-label="Search">
<select id="cat" aria-label="Category"><option value="all">All categories</option><option value="b">Birthdays</option><option value="a">Wedding anniversaries</option><option value="d">Death anniversaries</option></select>
<select id="br" aria-label="Family line"></select>
<button class="add" id="addBtn">+ Add member</button>
</div>
<div class="row2" id="qchips"></div>
<div class="row2">
<button id="expand">Expand all</button><button id="collapse">Collapse all</button>
<label class="chk"><input type="checkbox" id="dead" checked> Include birthdays of departed members</label>
</div>
</div>
<div class="soonbox"><h2>Coming up next</h2><div class="chips" id="soon"></div></div>
<main id="list"></main>
</div>

<div class="wrap" id="treeView" hidden></div>

<dialog id="dlg"><form id="frm" novalidate>
<h2>Add a family member</h2>
<label class="f">Full name<input id="fn" autocomplete="off"></label>
<label class="f">Nickname (optional)<input id="fk" autocomplete="off"></label>
<label class="f">Family line (optional)<input id="fb" list="bl" placeholder="e.g. Oscar"></label><datalist id="bl"></datalist>
<label class="f">Birthday<input id="d1" placeholder="1990-08-17, Aug 17 1990 or Aug 17"><small></small></label>
<label class="f">Wedding anniversary<input id="d2" placeholder="2015-04-29 or Apr 29"><small></small></label>
<label class="f">Death anniversary<input id="d3" placeholder="2022-12-10 or Dec 10"><small></small></label>
<p class="err" id="err" role="alert"></p>
<div class="acts"><button type="button" id="cancel">Cancel</button><button class="add" type="submit">Add to calendar</button></div>
</form></dialog>
<div id="toast" role="status"></div>

 const up=all.filter(e=>!(e.t==='b'&&e.dead)).map(e=>({...e,dd:nextOcc(e)})).sort((x,y)=>x.dd-y.dd).slice(0,6);
 $('#soon').innerHTML=up.map(e=>`<div class="chip ${e.t}"><b><a class="nm" href="#tree-${e.i}">${esc(e.name)}</a></b><span>${MON[e.m-1]} ${e.d}, ${e.t==='b'?'birthday':e.t==='a'?'anniversary':'death anniversary'}, ${e.dd===0?'today':'in '+e.dd+' days'}</span></div>`).join('');
 $('#stats').innerHTML=`<span><b>${members.length}</b>members</span><span><b>${all.filter(e=>e.t==='b').length}</b>birthdays</span><span><b>${all.filter(e=>e.t==='a').length}</b>anniversaries</span><span><b>${all.filter(e=>e.t==='d').length}</b>death anniversaries</span>`;
 const cur=$('#br').value||'all',bs=[...new Set(members.map(m=>m.branch))];
 if($('#br').options.length!==bs.length+1){$('#br').innerHTML='<option value="all">All family lines</option>'+bs.map(b=>`<option value="${esc(b)}">${esc(bl(b))}</option>`).join('');$('#br').value=bs.includes(cur)?cur:'all'}
 $('#bl').innerHTML=bs.map(b=>`<option value="${esc(b)}">`).join('');
 $('#qchips').innerHTML=['all',0,1,2,3].map(v=>`<button data-q="${v}" class="${qf===v?'on':''}">${v==='all'?'All quarters':`Q${v+1} ${QN[v].split(' – ')[0].slice(0,3)}–${QN[v].split(' – ')[1].slice(0,3)}`}</button>`).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
$('#qchips').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;qf=b.dataset.q==='all'?'all':+b.dataset.q;render()});
['q','cat','br','dead'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
$('#expand').onclick=()=>{for(let q=0;q<4;q++)'bad'.split('').forEach(t=>open.add(q+t));render()};
$('#collapse').onclick=()=>{open.clear();render()};
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const i=+b.dataset.rm-base.length;const n=added[i]&&added[i][0];added.splice(i,1);save();rebuild();render();toast(`Removed ${n}`)});
const dlg=$('#dlg');
$('#addBtn').onclick=()=>{$('#frm').reset();$('#err').textContent='';dlg.querySelectorAll('small').forEach(s=>s.textContent='');dlg.showModal();$('#fn').focus()};
$('#cancel').onclick=()=>dlg.close();
['d1','d2','d3'].forEach(id=>$('#'+id).addEventListener('input',e=>{const p=parseDate(e.target.value),s=e.target.parentNode.querySelector('small');
 s.textContent=!e.target.value.trim()?'':p?`${MON[p.m-1]} ${p.d}${p.y?', '+p.y:' (year not on record)'}`:'Try 1990-08-17 or Aug 17'}));
$('#frm').addEventListener('submit',ev=>{ev.preventDefault();const err=m=>$('#err').textContent=m;
 const name=$('#fn').value.trim(),vals=['d1','d2','d3'].map(id=>$('#'+id).value.trim()),ps=vals.map(parseDate);
 if(!name)return err('Enter a full name.');
 if(vals.some((v,i)=>v&&!ps[i]))return err('One of the dates isn’t valid. Use 1990-08-17 or Aug 17.');
 if(!ps.some(Boolean))return err('Add at least one date.');
 added.push([name,$('#fk').value.trim(),($('#fb').value.trim()||'Unassigned').replace(/ family$/i,''),iso(ps[0]),iso(ps[1]),iso(ps[2])]);
 save();rebuild();dlg.close();
 $('#q').value='';$('#cat').value='all';$('#br').value='all';qf='all';$('#dead').checked=true;
 const p=members[members.length-1];flash=members.length-1;
 [p.b,p.a,p.d].forEach((v,j)=>{if(v)open.add(Math.floor((v.m-1)/3)+'bad'[j])});
 render();const el=document.querySelector('li.flash');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
 const qs=[p.b,p.a,p.d].filter(Boolean).map(v=>'Q'+(Math.floor((v.m-1)/3)+1));
 toast(`Added ${name} to ${[...new Set(qs)].join(' and ')}`);setTimeout(()=>{flash=-1},3000)});
rebuild();render();
const LV="0 s0 1 s1 p 2 3 s3 4 4 3 s3 3 3 2 s2 3 s3 2 s2 3 3 1 s1 2 s2 3 3 s2 3 4 3 s3 4 s4 5 5 5 5 4 3 s3 4 3 2 s2 3 s3 3 s3 4 2 2 s2 3 3 s3 4 4 4 3 s3 4 4 3 s3 2 s2 3 2 s2 3 3 3 2 s2 3 3 4 3 3 2 s2 3 s3 3 s3 4 3 s3 4 2 s2 3 1 s1 2 s2 3 2 s2 3 3 2 s2 3 s3 4 4 4 4 3 s3 4 4 3 4 2 s2 3 s3 4 4 3 s3 4 4 4 3 3 2 2 s2 3 3 3 1 s1 2 s2 3 4 3 3 3 2 s2 3 s3 4 4 4 3 3 2 s2 3 s3 4 3 s3 4 4 3 s3 2 s2 3 3 2 s2 3 2 s2 3 2 s2 3 3 3 2 s2 3 1 2 1 s1 2 s2 2 s2 3 3 s3 4 3 2 s2 3 3 2 2 2 s2 3 3 2 s2 3 3 3 3 s3 4 3 2 2 s2 3 3 2 s2 3 1 s1 2 3 2 s2 3 3 3 2 s2 3 s3 4 4 3 2 s2 3 2 s2 3 3 3 1 s1 2 s2 3 3 2 s2 3 3 3 3 1 s1 2 s2 3 s3 4 3 s3 4 2 2 s2 3 1 1 s1 2 s2 3 2 s2 3 3 3 3 2 s2 3 3 3 1 1 s1 2 s2 3 3 3 3 3 3 2 s2 3 2 3".split(' '),UOF={};
(function(){const last={},ovr={305:301};let pend=[];
 base.forEach((_,i)=>{const c=LV[i];
  if(c==='p'){pend.push(i);return}
  if(c[0]==='s'){const u=last[+c.slice(1)];u.sp.push(i);UOF[i]=u;return}
  const L=+c,u={h:i,sp:pend,kids:[],par:null};pend.forEach(j=>UOF[j]=u);pend=[];UOF[i]=u;
  Object.keys(last).forEach(k=>{if(+k>=L)delete last[k]});
  const p=ovr[i]!==undefined?UOF[ovr[i]]:last[L-1];
  if(p){u.par=p;p.kids.push(u)}
  last[L]=u})})();
const fd=p=>p?`${MON[p.m-1]} ${p.d}${p.y?', '+p.y:''}`:'';
const people=u=>[u.h].concat(u.sp);
const short=j=>(members[j].nick||members[j].name.split(' ')[0]).trim();
const label=u=>people(u).map(short).join(' & ');
const countDesc=u=>u.kids.reduce((n,k)=>n+people(k).length+countDesc(k),0);
function personHTML(i,focus){const m=members[i],nk=m.nick.trim(),bits=[];
 if(m.b)bits.push('b. '+fd(m.b));if(m.d)bits.push('d. '+fd(m.d));
 return `<div class="pc${i===focus?' me':''}"><a href="#tree-${i}">${esc(m.name)}</a>${nk&&nk!==m.name?` <em>“${esc(nk)}”</em>`:''}${bits.length?`<small>${esc(bits.join(' · '))}</small>`:''}</div>`}
function unitHTML(u,focus,d,chain,k){const ps=people(u),mar=ps.map(j=>members[j].a).find(Boolean),onPath=chain&&k<chain.length-1;
 const kids=onPath?u.kids.map(c=>c===chain[k+1]?unitHTML(c,focus,d+1,chain,k+1):sibHTML(c,d+1)):u.kids.map(c=>unitHTML(c,focus,d+1,null,0));
 return `<div class="un"><div class="card${ps.includes(focus)?' me':''}"><div class="gen">Generation ${d}</div>${ps.map(j=>personHTML(j,focus)).join('')}${mar?`<div class="mar">Married ${esc(fd(mar))}</div>`:''}</div>${kids.length?`<div class="kids">${kids.join('')}</div>`:''}</div>`}
function sibHTML(u,d){const n=countDesc(u);
 return `<div class="un"><div class="card sib"><div class="gen">Generation ${d}</div>${people(u).map(j=>`<a href="#tree-${j}">${esc(members[j].name)}</a>`).join(' & ')}${n?`<small>${n} ${n===1?'descendant':'descendants'}</small>`:''}</div></div>`}
let calY=0;
function route(i){if(i===undefined){const m=location.hash.match(/^#tree-(\d+)$/);i=m?+m[1]:null}
 const cv=$('#calView'),tv=$('#treeView');
 if(i!==null&&members[i]){const u=UOF[i]||{h:i,sp:[],kids:[],par:null};
  if(!cv.hidden)calY=window.scrollY;
  const chain=[u];for(let p=u.par;p;p=p.par)chain.unshift(p);const anc=chain.slice(0,-1);
  const n=countDesc(u),mm=members[i];
  tv.innerHTML=`<a class="back" href="#">← Back to calendar</a>`
   +(anc.length?`<p class="crumbs">${anc.map(a=>`<a href="#tree-${a.h}">${esc(label(a))}</a>`).join(' › ')} › <b>${esc(label(u))}</b></p>`:'')
   +`<h1>${esc(mm.name)}</h1><p class="sub">Generation ${chain.length} · ${esc(bl(mm.branch))} · ${n?`${n} ${n===1?'descendant':'descendants'} on record`:'No children on record yet'}</p>`
   +`<div class="tree">${unitHTML(chain[0],i,1,chain,0)}</div>`;
  cv.hidden=true;tv.hidden=false;document.title=mm.name+' · Family tree';window.scrollTo(0,0)}
 else{const was=cv.hidden;tv.hidden=true;cv.hidden=false;document.title='Dungca–David Family Calendar';if(was)requestAnimationFrame(()=>window.scrollTo(0,calY))}}
window.addEventListener('hashchange',()=>route());window.addEventListener('popstate',()=>route());
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
 const h=a.getAttribute('href'),m=h.match(/^#tree-(\d+)$/);if(!m&&h!=='#')return;
 e.preventDefault();route(m?+m[1]:null);
 try{history.pushState(null,'',m?h:location.pathname+location.search)}catch(x){try{location.hash=m?h.slice(1):''}catch(y){}}});
route();
</script>
